name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Disable incremental compilation for CI builds
  CARGO_INCREMENTAL: 0
  # More precise error messages
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache LLVM 21
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm-21-install.tar.gz
          key: llvm-21-${{ runner.os }}-${{ hashFiles('scripts/install-llvm.sh', 'scripts/llvm.sh') }}

      - name: Restore LLVM from cache
        if: steps.cache-llvm.outputs.cache-hit == 'true'
        run: |
          sudo tar -xzf llvm-21-install.tar.gz -C /

      - name: Install LLVM 21
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          bash scripts/install-llvm.sh
          # Cache the installed LLVM for future runs
          sudo tar -czf llvm-21-install.tar.gz -C / \
            usr/lib/llvm-21 \
            usr/bin/llvm-config-21

      - name: Set LLVM environment variable
        run: echo "LLVM_SYS_211_PREFIX=$(bash scripts/detect-llvm.sh)" >> $GITHUB_ENV

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply formatting fixes
        run: cargo fmt --all

      - name: Commit formatting fixes
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: tcrypt25519/ci/.github/actions/commit-changes@main
        with:
          commit-message: "style: apply rustfmt formatting 🤖"

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check all targets
        run: cargo check --all-targets --all-features

      - name: Build
        run: cargo build --verbose --all-features

      - name: Run tests with nextest
        run: cargo nextest run --all-features --no-fail-fast

      - name: Run doctests
        run: cargo test --doc --all-features
